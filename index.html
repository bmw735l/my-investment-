<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的投資筆記</title>

<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f4f6f8;
    margin: 0;
    padding: 20px;
}
.container {
    max-width: 800px;
    margin: auto;
}
h1 {
    margin-bottom: 5px;
}
.subtitle {
    color: #666;
    margin-bottom: 25px;
}
.card {
    background: white;
    padding: 20px;
    border-radius: 16px;
    margin-bottom: 15px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
input {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    margin: 6px 0;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
}
button {
    width: 100%;
    padding: 13px;
    margin-top: 10px;
    border: none;
    border-radius: 10px;
    background: #007aff;
    color: white;
    font-size: 17px;
}
table {
    width: 100%;
    border-collapse: collapse;
}
th, td {
    padding: 10px;
    border-bottom: 1px solid #eee;
    text-align: left;
}
</style>
</head>

<body>

<div class="container">

<h1>📈 我的投資筆記</h1>
<div class="subtitle">先記錄，再決定。</div>

<div class="card">
<h2>新增股票</h2>

<input id="stock" placeholder="股票名稱，例如：力積電">
<input id="price" type="number" step="0.01" placeholder="買入價格">
<input id="shares" type="number" placeholder="股數">

<button onclick="addStock()">加入投資紀錄</button>
</div>

<div class="card">
<h2>我的持股</h2>

<table>
<thead>
<tr>
<th>股票</th>
<th>買入價</th>
<th>股數</th>
<th>投入金額</th>
</tr>
</thead>

<tbody id="stockList">
</tbody>
</table>

</div>

</div>

<script>
let stocks = JSON.parse(localStorage.getItem("stocks")) || [];

function showStocks() {
    const list = document.getElementById("stockList");
    list.innerHTML = "";

    stocks.forEach(item => {
        const total = item.price * item.shares;

        list.innerHTML += `
        <tr>
            <td>${item.stock}</td>
            <td>${item.price}</td>
            <td>${item.shares}</td>
            <td>${total.toLocaleString()}</td>
        </tr>`;
    });
}

function addStock() {
    const stock = document.getElementById("stock").value;
    const price = Number(document.getElementById("price").value);
    const shares = Number(document.getElementById("shares").value);

    if (!stock || !price || !shares) {
        alert("請把資料填完整");
        return;
    }

    stocks.push({stock, price, shares});
    localStorage.setItem("stocks", JSON.stringify(stocks));

    document.getElementById("stock").value = "";
    document.getElementById("price").value = "";
    document.getElementById("shares").value = "";

    showStocks();
}

showStocks();
</script>

</body>
</html>
