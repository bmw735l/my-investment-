name: Backfill OHLC and Institutional History
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backfill
        run: |
          python3 backfill_ohlc.py
          python3 backfill_institutions.py
      - name: Capture first EES snapshot
        run: node snapshot_ees.js
      - name: Commit history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add history.json ees_snapshots/
          git diff --cached --quiet || (git commit -m 'Backfill OHLC history' && git push)
