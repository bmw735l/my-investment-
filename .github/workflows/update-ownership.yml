name: Update Weekly Ownership
on:
  workflow_dispatch:
  schedule:
    - cron: '30 12 * * 1-5'
permissions:
  contents: write
concurrency:
  group: weekly-ownership
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch TDCC weekly snapshot
        run: python3 scripts/update_tdcc.py
      - name: Save ownership data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ownership.json
          if ! git diff --cached --quiet; then
            git commit -m "Update TDCC weekly ownership"
            git pull --rebase origin main
            git push
          fi
